{% extends 'pages/base.html' %}

{% block title %}Novo Post{% endblock %}

{% block content %}
    <h2 class="text-2xl font-bold mb-4">Criar Post</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
            Salvar
        </button>
    </form>

{% endblock %}
